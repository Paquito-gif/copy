name = "copy-launch"
main = "src/worker.ts"
compatibility_date = "2025-07-18"
compatibility_flags = ["nodejs_compat"]

# Site statique (public/) ; tout le reste passe par le Worker (/api, /m, /img)
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/m/*", "/img/*"]

[[d1_databases]]
binding = "DB"
database_name = "copy-launch"
database_id = "REMPLACER_PAR_L_ID_D1"   # wrangler d1 create copy-launch
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "copy-launch-files"       # wrangler r2 bucket create copy-launch-files

[[durable_objects.bindings]]
name = "ENGINE"
class_name = "CopyEngine"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CopyEngine"]

# Classement FOMO toutes les 5 h ; creator fees → SOL toutes les heures
[triggers]
crons = ["0 */5 * * *", "17 * * * *"]

[observability]
enabled = true

[vars]
FEE_RECEIVER = "Hd4UDXk3jBbKtuN4WHP96UWqfzzqhRcrqk1gjSzV9yRs"
SITE_NAME = "Copy Launch"
TRADER_SOURCE = "fomo"
LEADERBOARD_WINDOW = "24h"
MODE = "TOP1"
BASKET_SIZE = "3"
MAX_POSITION_PCT = "8"
MAX_OPEN_POSITIONS = "6"
MIN_TRADE_SOL = "0.05"
STOP_LOSS_PCT = "35"
TAKE_PROFIT_PCT = "150"
MAX_DAILY_LOSS_PCT = "20"
MAX_PRICE_IMPACT_PCT = "3"
SLIPPAGE_BPS = "300"
SOL_RESERVE = "0.05"
BUYBACK_PCT = "80"
MIN_BUYBACK_SOL = "0.1"
POLL_SECONDS = "10"
MONITOR_SECONDS = "30"
DRY_RUN = "true"

# Secrets (jamais dans ce fichier) :
#   wrangler secret put RPC_URL          (ex. https://mainnet.helius-rpc.com/?api-key=…)
#   wrangler secret put BOT_PRIVATE_KEY  (clé base58 du wallet FEE_RECEIVER)
#   wrangler secret put ADMIN_TOKEN      (mot de passe pour démarrer / mettre en pause le moteur)
#   wrangler secret put FOMO_API_KEY     (optionnel)
