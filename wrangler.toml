name = "copy-launch"
main = "src/worker.ts"
compatibility_date = "2025-07-18"
compatibility_flags = ["nodejs_compat"]

# Le site (public/) est intégré au Worker par scripts/build-site.mjs (npm run build:site)

[[d1_databases]]
binding = "DB"
database_name = "copy-launch"
database_id = "0b79f7ec-02c6-457f-b7de-bf973cb8007f"
migrations_dir = "migrations"

# Images et fiches des coins (Workers KV ; valeurs jusqu'à 25 Mo, images limitées à 1 Mo)
[[kv_namespaces]]
binding = "FILES"
id = "2cb5275dfb1e4a70a3b0ee37397ff9a6"

[[durable_objects.bindings]]
name = "ENGINE"
class_name = "CopyEngine"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CopyEngine"]

# Classement FOMO toutes les 5 h ; creator fees → SOL toutes les heures
[triggers]
crons = ["0 */5 * * *", "17 * * * *"]

[observability]
enabled = true

[vars]
FEE_RECEIVER = "Hd4UDXk3jBbKtuN4WHP96UWqfzzqhRcrqk1gjSzV9yRs"
SITE_NAME = "Flomo"
TRADER_SOURCE = "fomo"
LEADERBOARD_WINDOW = "24h"
MODE = "TOP1"
BASKET_SIZE = "3"
MAX_POSITION_PCT = "25"
# hard cap per copied trade, in US dollars (converted at the live SOL price)
MAX_TRADE_USD = "100"
MAX_OPEN_POSITIONS = "6"
MIN_TRADE_SOL = "0.05"
# 0 = off: positions are only closed when the copied trader sells (same proportion)
STOP_LOSS_PCT = "0"
TAKE_PROFIT_PCT = "0"
MAX_DAILY_LOSS_PCT = "20"
MAX_PRICE_IMPACT_PCT = "3"
SLIPPAGE_BPS = "300"
SOL_RESERVE = "0.05"
BUYBACK_PCT = "80"
MIN_BUYBACK_SOL = "0.1"
POLL_SECONDS = "10"
MONITOR_SECONDS = "30"
DRY_RUN = "true"
# "off": keyed RPCs (Helius…) in RPC_URL are skipped to save credits; set "on" for launch
PRIVATE_RPC = "off"

# Secrets (jamais dans ce fichier) :
#   wrangler secret put RPC_URL          (ex. https://mainnet.helius-rpc.com/?api-key=…)
#   wrangler secret put BOT_PRIVATE_KEY  (clé base58 du wallet FEE_RECEIVER)
#   wrangler secret put ADMIN_TOKEN      (mot de passe pour démarrer / mettre en pause le moteur)
#   wrangler secret put FOMO_API_KEY     (optionnel)

# Per-IP rate limits (Workers Rate Limiting API)
[[ratelimits]]
name = "RL_WRITE"
namespace_id = "1001"
simple = { limit = 12, period = 60 }

[[ratelimits]]
name = "RL_READ"
namespace_id = "1002"
simple = { limit = 120, period = 60 }
